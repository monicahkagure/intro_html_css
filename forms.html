<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ranchers&family=Roboto:ital,wght@0,100..900;1,100..900&family=Spicy+Rice&display=swap" rel="stylesheet">
<style>
        body{
background-color: #fcf8f8;
 font-family: "Roboto", sans-serif; 
font-weight: 400;
  font-style: normal;
}
form{
    border: 1px solid #8a13eb;
width: 28%;
padding: 16px;
margin: auto;
}
label{
    color: #ff0000
}
.full-width{
    width: 100%;
    padding: 10px
    box-sizing: border-box;
    margin-bottom: 12px;
    
}
button{
    width: 100%;
    color: #050505;
    padding: 12px 20px
    border-radius: 10px;
    
}


</style>


</head>

<body>

    <!-- text, email, password, number,  date, radio, checkbox, select, submit -->

    <form>
        <label for="names">Names</label>
        <input class="full-width" type="text" required id="names" name="full name" placeholder="Jane Doe">

    
        <label for="email">Email</label>
        <input class="full-width"type="email" required id="email" name="email" placeholder="Jane Doe">

        <br>
        <label for="pass">Password</label>
        <input class="full-width"type="password" required id="pass" name="password" placeholder="Jane Doe">

<br>
        <label for="weight">Weight</label>
        <input class="full-width"type="number" min="30" max="250" step="0.01" required id="weight" name="weight" placeholder="Jane Doe">
<br>
        <label for="dob">Date of Birth</label>
        <input class="full-width"type="date" min="1948-01-01" max="2008-12-31" required id="dob" name="date_of_birth" />


        <!-- names must be the same for radio buttons -->
        <br>
        <label >Select your Gender</label>
        <br>
        <input type="radio"id="m" name="gender">
        <label for="m">Female</label>

        <br>
        <input type="radio" id="f" name="gender">
        <label for="f">Male</label>

<hr>

<br>
<label > Select your Sport</label>
        <br>
<input type="checkbox" id="x" name="food"> 
        <label for="x">Pizza</label>

<br>
        <input type="checkbox" id="z" name="food"> 
        <label for="z">Ugali</label>

<br>
        <input type="checkbox" id="y" name="food"> 
        <label for="y">Burger</label>
<p>Lorem ipsum dolor sit amet</p>

        <br>
        <label>Select your County</label>
<br>
        <select class="full-width">
<option value="1">Mombasa</option>
<option value="2">Kisumu</option>
<option value="3">Kisii</option>
<option value="4">Nairobi</option>
<option value="5">Nyeri</option>
</select>


<!-- slider -->
<br>

        <button>Register</button>




    </form>

</body>

</html>
